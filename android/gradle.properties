# Gradle daemon memory is kept modest (4 GB heap / 2 GB metaspace) because this
# machine is used for other work in parallel; Flutter's template default is 8 GB.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Flags added by the Flutter 3.47 Android template.
android.newDsl=false
android.builtInKotlin=false
